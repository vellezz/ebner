name: Experiment

# Writes the same entry under two settings and prints both, so a routing
# decision can be made from a comparison rather than from an opinion.
#
# Nothing is committed and nothing reaches D1 or the site. The run costs real
# money — two full entries — so it is manual, and the answer goes in the run
# log for whoever asked.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed. The same one draws the same parameters for both variants.'
        required: true
        default: '1'
      effort:
        description: 'Settings to compare on the writing step, comma separated.'
        required: false
        default: 'high,medium'

# Reads world state and writes nothing, so it does not belong in the state
# group — but it must not run while a state change is half applied.
concurrency:
  group: ebner-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pnpm --dir apps/site install --frozen-lockfile
          pip install -e apps/generator

      - name: Compare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m ebner experiment \
            --seed "${{ inputs.seed }}" \
            --effort "${{ inputs.effort }}"
