name: Apply state

# Projects content/state/ into D1 and Vectorize after an entry lands. D1 holds
# nothing that cannot be rebuilt by replaying those files, so this workflow is
# always safe to re-run and never the source of truth.
on:
  push:
    branches: [main]
    paths:
      - 'content/state/**'
  workflow_dispatch:

concurrency:
  group: ebner-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits, so the changed state files can be worked out. Only
          # those get re-embedded; embeddings cost money and replaying every
          # fragment daily would waste it.
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pnpm --dir apps/site install --frozen-lockfile
          pip install -e apps/generator

      # Only what this push changed. Replaying every file is idempotent, which
      # is why it was done that way, and it is not cheap: each file rewrites
      # the whole of `entities` and `threads` to recompute their counters, so
      # one run cost about three and a half thousand written rows across
      # forty-five files. Twenty-five pushes in a day reached three quarters of
      # D1's daily free allowance, and exceeding it would have stopped
      # generation altogether.
      #
      # `rebuild-state.yml` is where replaying everything belongs, and it
      # exists.
      - name: Apply to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- content/state/ \
                  | sed -n 's#content/state/##p' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "no state file changed; nothing to apply"
          else
            echo "applying: $files"
            python -m ebner apply $files
          fi

      - name: Index new fragments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          days=$(git diff --name-only HEAD~1 HEAD -- content/state/ \
                 | sed -n 's#content/state/0*\([0-9]\+\)\.json#\1#p' \
                 | tr '\n' ' ')
          if [ -z "$days" ]; then
            echo "no entry state changed; nothing to embed"
          else
            echo "indexing days: $days"
            python -m ebner index $days
          fi
