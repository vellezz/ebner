# Rhythm: what the randomiser picks before the writer runs.
#
# Polish values are literary content; keys and identifiers are English.

# How far the in-world date advances from the previous entry.
#
# Publication is daily and unattended, so the MEAN here decides how fast the
# world ages: a mean near 2 makes a year of publishing roughly two years of
# Ebner's life. The cap stops a single bad roll; the mean stops slow drift,
# which is the more dangerous of the two because no single entry looks wrong.
day_step:
  cap: 7
  weights:
    1: 55
    2: 20
    3: 11
    4: 6
    5: 4
    6: 2
    7: 2
  # Longer hops belong to entries that are about being on the move.
  allow_above_3_only_for: [travel, stopover]

# World growth.
#
# This is a travelogue, so new destinations must keep arriving. Scheduled here
# rather than left to emerge, because emergent growth either stalls or floods.
# The design's own reckoning — 41 places across 220 entries — is about one new
# destination every five.
#
# There is no cap on entity rows: a destination brings its containment chain
# (system, planet, station) and counting rows would block the most ordinary
# entry in the cycle, arriving somewhere new for a job.
world_growth:
  new_destination_every: [4, 6] # entries; picked within this range
  revisit_pressure:
    # A place unvisited for this long becomes a candidate the context surfaces
    # as "somewhere he has not been in a while". The pressure runs both ways:
    # a world of single-use names accumulates nothing.
    stale_after_days: 60
    # These kinds lean toward a known place rather than a new one.
    prefer_known_for: [continuation, resolution, quiet, documents]

# Word counts, not paragraph counts — the writer reads these verbatim.
#
# These bands are obeyed exactly. Across forty-six entries not one landed
# outside them: nothing between 201 and 299 words, nothing between 701 and 899,
# nothing above 1,600. So this block is the whole of the length decision, and
# the only one.
#
# Within a band the writer sits low, so the floor decides and the ceiling is
# nearly decoration. `long` began at 900 to 1,600 and produced a mean of 1,087
# with a longest-ever of 1,178: the top half was never used.
#
# Cut twice. The first pass took the corpus mean from 653 words to about 500 by
# moving `long` to 700–1,100, and the next entry came out at 884 — the middle of
# that band, and still too long to read. So the bands move again rather than the
# weights doing the work alone: nothing may now pass 900 words, which is shorter
# than sixteen of the forty-six entries published so far.
#
# Expected mean is about 390. Below roughly 500 words the bill stops falling
# much: a 400-word entry spends some 2,500 output tokens on the writing step,
# against 25,000 of input on that step alone, so what remains is the context and
# the other three steps rather than the prose.
length:
  - id: note
    weight: 25
    words: [50, 200]
    label: "notatka: kilka zdań, jedna obserwacja, jedno zdarzenie"
  - id: medium
    weight: 55
    words: [250, 500]
    label: "średni wpis"
  - id: long
    weight: 20
    words: [600, 900]
    label: "długi wpis: sceny z dialogiem i konkretną robotą, nie streszczenia"

# Thread discipline. The ceilings are in CLAUDE.md; this is when a thread stops
# counting as alive.
#
# The pressure that existed before was advisory: a thread past its time got a
# line in the prompt saying "close or abandon soon", and the writer ignored it.
# Three threads sat active and untouched for forty-eight, thirty-six and twenty
# in-world days, holding three of the five slots, so nothing new could open and
# every entry had to develop the one living thread — a tow explicitly a hundred
# days from arriving. The entries went eventless, and that is what a reader
# noticed first.
threads:
  max_active: 5
  # Untouched for this many in-world days and the review abandons it. Not a
  # judgement at this distance: forty-eight days is not a pause.
  abandon_after_idle_days: 30

# Length bands a kind may not draw. A journey needs room for a departure, a way
# and an arrival; asked for a travel entry in two hundred words, the writer
# dropped all three and described a lift ride that went nowhere (day 22).
length_floor:
  travel: [note]
  new_job: [note]
  adventure: [note]
  resolution: [note]

# Entry kinds. Values must match the enum in content/schema/entry.schema.json.
kind:
  - id: travel
    weight: 16
    label: "dzień w drodze: podróż, przystanek, zdarzenie po drodze"
  - id: new_job
    weight: 14
    label: "nowe zlecenie: przybycie, pierwsze rozpoznanie, klient"
  - id: continuation
    weight: 16
    label: "ciąg dalszy sprawy w toku"
  - id: resolution
    weight: 10
    label: "rozstrzygnięcie sprawy: udane, nieudane albo niejasne"
  - id: adventure
    weight: 10
    label: "przygoda lub niebezpieczeństwo, niezwiązane ze zleceniem"
  - id: note
    weight: 10
    label: "krótka notatka"
  - id: documents
    weight: 6
    label: "wpis z dokumentów: faktura, spis wydatków, korespondencja, z krótkim komentarzem"
  - id: stopover
    weight: 10
    label: "postój: naprawa Hanny, port, bar, spotkanie z kimś"
  - id: quiet
    weight: 8
    label: "cisza: nic się nie wydarzyło — naprawił, zjadł, policzył, co zostało"

# Staying put.
#
# Nineteen entries and thirty-two in-world days in one hall, and nine in another
# before it: the last twenty-eight entries are in exactly two places, with one
# travel entry among them. The schedule above was supposed to prevent that and
# could not, because its counter read three — it measured when a place was last
# *named*, and day 54 named a moon he has never been to. A working counter alone
# would not have been enough either, since the four kinds that dominate the draw
# veto a new destination outright.
#
# So the pressure goes on the draw rather than into the prompt. Nothing here
# names a thread or dictates how a stay ends; it makes a departure-shaped entry
# likelier the longer he sits, and the writer finds the reason in the world —
# which usually already holds one, because a man who has been somewhere for a
# month has accumulated reasons to leave.
stay_pressure:
  # A diary is allowed to sit somewhere. Nothing happens before this.
  after_entries: 6
  # Per entry beyond that. Multiplies the departure kinds and divides the ones
  # that keep him where he is.
  per_entry: 0.15
  # It tilts the draw; it never decides it. A forced departure would be the
  # same mistake as an instruction, only harder to see.
  cap: 3.0
  departure: [travel, new_job, stopover]
  settled: [continuation, quiet, documents]

# When something is already running, lean into it rather than starting again.
kind_bias:
  when_open_thread_due:
    continuation: 2.0
    resolution: 1.8
  when_no_open_threads:
    new_job: 2.0
    travel: 1.4

# Optional. The writer may ignore a hint that does not fit the world state.
hints:
  jobs:
    - "brama tunelowa"
    - "terraformer"
    - "winda orbitalna"
    - "reaktor"
    - "stacja przeładunkowa"
    - "system podtrzymywania życia"
    - "SI habitatu"
    - "maszyna obcych o nieznanej konstrukcji"
    - "poprawka po Holdmark Serwis"
    - "zjawisko egzotyczne: rozregulowana stała, zapowietrzony czas"  # rzadko
  road:
    - "sygnał ratunkowy z miejsca, gdzie nie powinno być statku"
    - "wrak z ładunkiem, do którego ktoś rości sobie prawa"
    - "pasażer na gapę"
    - "kontrola celna według przepisów, których Ebner nie zna"
    - "objazd przez nieznany układ"
    - "awaria w próżni, daleko od portu"
    - "spotkanie z podróżnym, który zna Ebnera z przeszłości"
    - "planeta, której nie ma na mapach"
  # To smuggle in, never to lecture. Weighted low on purpose.
  themes:
    - "sprawiedliwość a równość"
    - "pamięć i tożsamość"
    - "wolność a bezpieczeństwo"
    - "prawda a dobro"
    - "większość a racja"
    - "porządek a życie"
    - "posiadanie czasu"
    - "odpowiedzialność za cudze obietnice"
    - "granica między naprawą a zmianą"

hint_probability:
  jobs: 0.40
  road: 0.35
  themes: 0.10
  none: 0.15
