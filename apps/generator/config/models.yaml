# Per-step model routing. Changing a model is a one-line change here.
#
# Effort is set on every step on purpose. Opus 5 runs adaptive thinking by
# default at effort `high`, and thinking tokens bill as output — that single
# inherited default is the largest line in the bill. It is a decision, so it is
# written down.

steps:
  # The only step whose quality the reader sees directly. Worth the effort.
  write:
    model: claude-opus-5
    effort: high
    max_tokens: 16000

  # Judging fuzzy consistency against recorded state. Needs reasoning, not
  # prose, and it is also the enforcement gate — a false block costs a day.
  check:
    model: claude-sonnet-5
    effort: medium
    max_tokens: 16000

  # Language only, no judgement about content. Low effort is the point: a
  # thorough editor here would start rewriting, which is exactly what the
  # prompt forbids.
  edit:
    model: claude-sonnet-5
    effort: low
    max_tokens: 16000

  # Called a mechanical transformation into JSON, which is how it was routed to
  # Haiku, and that description is wrong. The JSON is full of Polish prose —
  # entity names shown on the site, fact texts fed back into later prompts,
  # thread summaries — so it is literary content in a structured wrapper.
  #
  # Haiku wrote `Stacja glosowania` without its diacritic, `podlegaje` for
  # `podlega`, and a sketch reading "Wnętrze tandetnej windy na niskiego
  # księżyca, z zaślepioną przysłonięciem czasową". Broken Polish here does not
  # stay here: it becomes the premise a later entry is written against.
  #
  # Sonnet at low effort costs about $0.014 more an entry, five per cent of a
  # typical bill, to stop the canon accumulating text nobody would publish.
  state:
    model: claude-sonnet-5
    effort: low
    max_tokens: 8000

# USD per million tokens, for reporting what a run actually cost. Estimates
# from assumed context sizes were what we had before; these turn every run into
# a measurement instead. Thinking bills as output, so the output column is
# where effort shows up.
#
# cache_write is 1.25x input (5-minute TTL) and cache_read is 0.1x, which is
# why no step caches today: caches are scoped per model and no two calls in a
# run share both a model and a prefix, so a write would never be read.
prices:
  claude-opus-5:    { input: 5.00, output: 25.00 }
  claude-sonnet-5:  { input: 2.00, output: 10.00 }
  claude-haiku-4-5: { input: 1.00, output: 5.00 }
